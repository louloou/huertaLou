<!DOCTYPE html>

    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <input type="checkbox" name="" id="toggler">
        <label for="toggler" class="fas fa-bars"></label>
        
        <a href="#" class="logo">Huerta<span>.</span></a>
        
        <nav class="navbar">

    <div class="form">
