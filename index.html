<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HuertaLou</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
        <h1> Monitor Inteligente de Plantas</h1>
        <p class="subtitulo">Visualización en tiempo real del estado de tu huerta</p>
    </header>

    <div class="contenedor">
        <h2>Estado de la Planta</h2>

        <img id="planta" src="plantaNormal.png" class="planta" width="10">

        <div class="datos">
            <p>🌿 Humedad del suelo: <span id="suelo">--</span>%</p>
            <p>💧 Humedad del aire: <span id="aire">--</span>%</p>
            <p>🌡️ Temperatura: <span id="temp">--</span>°C</p>
        </div>
    </div>
</body>

<script src="script.js" type="module"></script>

</html>
